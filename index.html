<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapTube</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f7f5f0;
    --line:#d8d3c6;
    --accent:#3a6b52;
    --accent-soft:#e7efe9;
    --danger:#a8402f;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--paper);}
  header{
    padding:12px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  header h1{font-size:18px; margin:0;}
  #authArea{display:flex; align-items:center; gap:10px; font-size:13px;}
  #authArea .nickname{font-weight:bold; color:var(--accent);}
  button.link-btn{
    background:none; border:1px solid var(--line); border-radius:6px;
    padding:6px 12px; cursor:pointer; font-size:13px; color:var(--ink);
  }
  button.primary{
    background:var(--accent); color:#fff; border:none; border-radius:6px;
    padding:9px 22px; font-size:14px; cursor:pointer;
  }
  button.primary:disabled{background:#9fb3a8; cursor:not-allowed;}
  button.danger{background:var(--danger); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:12px; cursor:pointer;}

  #map{width:100%; height:calc(100vh - 210px); min-height:320px;}

  #panel{padding:12px 18px 18px; border-top:1px solid var(--line); background:#fff;}
  #panel form{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; max-width:760px;}
  #panel label{font-size:12px; color:#555; display:block; margin-bottom:2px;}
  #panel input[type=text], #panel input[type=email], #panel input[type=password],
  #panel input[type=url], #panel textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:var(--paper);
  }
  #panel textarea{grid-column:1/-1; resize:vertical; min-height:56px;}
  .full{grid-column:1/-1;}
  .hint{font-size:12px; color:#777;}
  #status{font-size:13px; min-height:18px;}
  #status.error{color:var(--danger);}
  #status.ok{color:var(--accent);}

  .hp-field{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}

  #photoPreviewWrap{display:none; align-items:center; gap:10px; margin-top:4px;}
  #photoPreview{max-width:120px; max-height:120px; border-radius:6px; border:1px solid var(--line); display:block;}
  #photoRemoveBtn{font-size:12px;}
  .photo-processing{font-size:12px; color:#777;}

  .popup-photo{margin-top:6px;}
  .popup-photo img{max-width:220px; max-height:220px; border-radius:6px; display:block; cursor:zoom-in;}

  /* モーダル(ログイン/登録/パスワード変更) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  .modal-box{
    background:#fff; border-radius:10px; padding:24px; width:min(90vw, 380px);
  }
  .modal-box h2{margin-top:0; font-size:16px;}
  .modal-box label{font-size:12px; color:#555; display:block; margin:10px 0 4px;}
  .modal-box input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px;
  }
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
  .modal-switch{font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; text-decoration:underline;}

  .password-field{position:relative;}
  .password-field input{padding-right:56px;}
  .password-toggle{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    background:none; border:none; font-size:11px; color:var(--accent);
    cursor:pointer; padding:4px 8px;
  }

  .leaflet-popup-content{font-size:13px; line-height:1.6; max-width:240px;}
  .leaflet-popup-content .video-link{display:inline-block; margin-top:6px; color:var(--accent); font-weight:bold; text-decoration:none;}
  .popup-nickname{font-size:12px; color:#777; margin-bottom:4px;}
  .popup-actions{display:flex; gap:6px; margin-top:8px;}

  .comments-wrap{margin-top:10px; padding-top:8px; border-top:1px solid var(--line);}
  .comments-title{font-size:12px; font-weight:bold; color:#555; margin-bottom:4px;}
  .comments-list{max-height:140px; overflow-y:auto; margin-bottom:6px;}
  .comment-row{padding:4px 0; border-bottom:1px dashed var(--line);}
  .comment-meta{font-size:11px; color:var(--accent); font-weight:bold;}
  .comment-body{font-size:12px; white-space:pre-wrap; word-break:break-word;}
  .comment-actions{display:flex; gap:6px; margin-top:2px;}
  .comment-actions button{font-size:11px; padding:2px 8px;}
  .comment-form textarea{
    width:100%; font-size:12px; padding:6px; border:1px solid var(--line); border-radius:6px;
    resize:vertical; min-height:40px; margin-bottom:4px;
  }
  .comment-form button{font-size:12px;}
</style>
</head>
<body>

<header>
  <h1>MapTube</h1>
  <div id="authArea"></div>
</header>

<div id="map"></div>

<div id="panel">
  <div id="postFormWrap" style="display:none;">
    <form id="postForm" autocomplete="off">
      <div class="full">
        <label>選択した位置</label>
        <input type="text" id="latlngDisplay" readonly placeholder="地図上をクリックして位置を選択してください">
      </div>
      <div>
        <label for="videoUrl">動画URL (YouTube / X / Instagram / TikTok)(写真のみの場合は空でも可)</label>
        <input type="url" id="videoUrl" maxlength="300" placeholder="https://youtube.com/...">
      </div>
      <div>
        <label for="description">説明文(200文字まで)</label>
      </div>
      <textarea id="description" maxlength="200" placeholder="動画の内容や見どころを書いてください" class="full"></textarea>
      <div class="full">
        <label for="photoInput">写真(動画URLが無い場合は必須・自動で適正サイズに縮小されます)</label>
        <input type="file" id="photoInput" accept="image/*">
        <div id="photoPreviewWrap">
          <img id="photoPreview" alt="選択した写真のプレビュー">
          <button type="button" class="link-btn" id="photoRemoveBtn" onclick="clearSelectedPhoto()">写真を削除</button>
        </div>
        <div class="photo-processing" id="photoProcessing"></div>
      </div>
      <div class="hp-field" aria-hidden="true">
        <label>この欄は入力しないでください</label>
        <input type="text" id="hp" tabindex="-1" autocomplete="off">
      </div>
      <div class="hint full">
        投稿することで<a href="disclaimer.html" target="_blank">免責事項</a>に同意したものとみなします。
      </div>
      <button type="submit" class="primary" id="submitBtn">この内容で投稿する</button>
      <div id="status" class="full"></div>
    </form>
  </div>
  <div id="loginPrompt" class="hint">投稿するには<button class="link-btn" onclick="showLogin()">ログイン</button>または<button class="link-btn" onclick="showRegister()">新規登録</button>してください。</div>
</div>

<!-- ログインモーダル -->
<div class="modal-overlay" id="loginModal" style="display:none;">
  <div class="modal-box">
    <h2>ログイン</h2>
    <label for="loginEmail">登録メールアドレス</label>
    <input type="email" id="loginEmail">
    <label for="loginPassword">パスワード</label>
    <div class="password-field">
      <input type="password" id="loginPassword">
      <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)">表示</button>
    </div>
    <div id="loginStatus" style="font-size:12px; color:var(--danger); margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="modal-switch" onclick="closeModals(); showRegister();">新規登録はこちら</button>
      <button class="primary" onclick="doLogin()">ログイン</button>
    </div>
    <div style="text-align:right; margin-top:8px;">
      <button class="link-btn" onclick="closeModals()">閉じる</button>
    </div>
  </div>
</div>

<!-- 新規登録モーダル -->
<div class="modal-overlay" id="registerModal" style="display:none;">
  <div class="modal-box">
    <h2>新規登録</h2>
    <label for="regEmail">メールアドレス</label>
    <input type="email" id="regEmail">
    <label for="regNickname">ニックネーム(地図上に表示されます)</label>
    <input type="text" id="regNickname" maxlength="30">
    <div class="hp-field" aria-hidden="true">
      <label>この欄は入力しないでください</label>
      <input type="text" id="regHp" tabindex="-1" autocomplete="off">
    </div>
    <div id="registerStatus" style="font-size:12px; margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="modal-switch" onclick="closeModals(); showLogin();">ログインはこちら</button>
      <button class="primary" onclick="doRegister()">登録する</button>
    </div>
    <div style="text-align:right; margin-top:8px;">
      <button class="link-btn" onclick="closeModals()">閉じる</button>
    </div>
  </div>
</div>

<!-- ニックネーム変更モーダル -->
<div class="modal-overlay" id="nicknameModal" style="display:none;">
  <div class="modal-box">
    <h2>ニックネーム変更</h2>
    <p class="hint">既存の投稿・コメントの表示名も新しいニックネームに更新されます。</p>
    <label for="nicknameInput">新しいニックネーム</label>
    <input type="text" id="nicknameInput" maxlength="30">
    <div id="nicknameStatus" style="font-size:12px; margin-top:8px;"></div>
    <div class="modal-actions">
      <span></span>
      <button class="primary" onclick="doUpdateNickname()">変更する</button>
    </div>
    <div style="text-align:right; margin-top:8px;">
      <button class="link-btn" onclick="closeModals()">閉じる</button>
    </div>
  </div>
</div>

<!-- パスワード変更モーダル(初回ログイン時は強制表示) -->
<div class="modal-overlay" id="pwModal" style="display:none;">
  <div class="modal-box">
    <h2 id="pwModalTitle">パスワード変更</h2>
    <p class="hint" id="pwModalHint"></p>
    <label for="oldPassword">現在のパスワード</label>
    <div class="password-field">
      <input type="password" id="oldPassword">
      <button type="button" class="password-toggle" onclick="togglePasswordVisibility('oldPassword', this)">表示</button>
    </div>
    <label for="newPassword">新しいパスワード(8文字以上)</label>
    <div class="password-field">
      <input type="password" id="newPassword">
      <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword', this)">表示</button>
    </div>
    <div id="pwStatus" style="font-size:12px; margin-top:8px;"></div>
    <div class="modal-actions">
      <span></span>
      <button class="primary" onclick="doChangePassword()">変更する</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ==============================
   設定
   ============================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyc1y8KtB7EO3H37HLBsMZHB7Foie6qEzyTdSyQO50PI999Za68pEOC62o47ar880nG/exec'; // デプロイ後のURLに置き換える

/* ==============================
   セッション状態(localStorageに保持)
   ============================== */
let session = JSON.parse(localStorage.getItem('vpm_session') || 'null');
// session = { token, nickname, role }

function saveSession(s) {
  session = s;
  localStorage.setItem('vpm_session', JSON.stringify(s));
  renderAuthArea();
}
function clearSession() {
  session = null;
  localStorage.removeItem('vpm_session');
  renderAuthArea();
}

async function api(action, payload, timeoutMs = 45000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload)),
      signal: controller.signal
    });
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (parseErr) {
      console.error('APIレスポンスの解析に失敗しました', text);
      return { status: 'error', message: 'サーバーの応答が不正でした。時間をおいて再度お試しください。' };
    }
  } catch (err) {
    console.error('API通信エラー', err);
    if (err.name === 'AbortError') {
      return { status: 'error', message: '通信がタイムアウトしました。電波状況を確認するか、写真を選び直して再度お試しください。' };
    }
    return { status: 'error', message: '通信エラーが発生しました。時間をおいて再度お試しください。' };
  } finally {
    clearTimeout(timeoutId);
  }
}

/* ==============================
   認証UI描画
   ============================== */
function renderAuthArea() {
  const el = document.getElementById('authArea');
  const formWrap = document.getElementById('postFormWrap');
  const loginPrompt = document.getElementById('loginPrompt');

  if (session && session.token) {
    el.innerHTML =
      `<span class="nickname">${escapeForDisplay(session.nickname)}</span> さん` +
      `<button class="link-btn" onclick="showNicknameEdit()">ニックネーム変更</button>` +
      `<button class="link-btn" onclick="showChangePassword(false)">パスワード変更</button>` +
      `<button class="link-btn" onclick="doLogout()">ログアウト</button>`;
    formWrap.style.display = 'block';
    loginPrompt.style.display = 'none';
  } else {
    el.innerHTML = '';
    formWrap.style.display = 'none';
    loginPrompt.style.display = 'block';
  }
}
function escapeForDisplay(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

/* ==============================
   モーダル制御
   ============================== */
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '非表示';
  } else {
    input.type = 'password';
    btn.textContent = '表示';
  }
}

function closeModals() {
  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('registerModal').style.display = 'none';
  document.getElementById('pwModal').style.display = 'none';
  document.getElementById('nicknameModal').style.display = 'none';
  // パスワード表示状態をリセット(モーダルを開き直した時に前回の表示状態が残らないように)
  document.querySelectorAll('.password-field input').forEach(input => { input.type = 'password'; });
  document.querySelectorAll('.password-toggle').forEach(btn => { btn.textContent = '表示'; });
}
function showLogin() { closeModals(); document.getElementById('loginModal').style.display = 'flex'; }
function showRegister() { closeModals(); document.getElementById('registerModal').style.display = 'flex'; }
function showNicknameEdit() {
  closeModals();
  document.getElementById('nicknameInput').value = session.nickname;
  document.getElementById('nicknameStatus').textContent = '';
  document.getElementById('nicknameModal').style.display = 'flex';
}
function showChangePassword(forced) {
  closeModals();
  document.getElementById('pwModalHint').textContent = forced
    ? '初回ログインです。仮パスワードから新しいパスワードに変更してください。'
    : '';
  document.getElementById('pwModal').style.display = 'flex';
}

async function doUpdateNickname() {
  const newNickname = document.getElementById('nicknameInput').value.trim();
  const statusEl = document.getElementById('nicknameStatus');
  if (!newNickname) { statusEl.style.color = 'var(--danger)'; statusEl.textContent = 'ニックネームを入力してください。'; return; }
  statusEl.style.color = '#555';
  statusEl.textContent = '処理中...';

  const data = await api('updateNickname', { token: session.token, nickname: newNickname });
  if (data.status === 'ok') {
    saveSession({ token: session.token, nickname: data.nickname, role: session.role });
    statusEl.style.color = 'var(--accent)';
    statusEl.textContent = 'ニックネームを変更しました。';
    loadPins();
    setTimeout(closeModals, 800);
  } else {
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = data.message || '変更に失敗しました。';
  }
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const statusEl = document.getElementById('loginStatus');
  statusEl.textContent = 'ログイン中...';

  const data = await api('login', { email, password });
  if (data.status === 'ok') {
    saveSession({ token: data.token, nickname: data.nickname, role: data.role });
    closeModals();
    if (data.mustChangePassword) showChangePassword(true);
    loadPins();
  } else {
    statusEl.textContent = data.message || 'ログインに失敗しました。';
  }
}

async function doRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const hp = document.getElementById('regHp').value;
  const statusEl = document.getElementById('registerStatus');
  statusEl.className = ''; statusEl.textContent = '登録中...';

  const data = await api('register', { email, nickname, hp });
  if (data.status === 'ok') {
    statusEl.style.color = 'var(--accent)';
    statusEl.textContent = data.message + ' メール内の仮パスワードでログインしてください。';
  } else {
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = data.message || '登録に失敗しました。';
  }
}

async function doLogout() {
  if (session && session.token) await api('logout', { token: session.token });
  clearSession();
}

async function doChangePassword() {
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const statusEl = document.getElementById('pwStatus');
  statusEl.textContent = '処理中...';

  const data = await api('changePassword', { token: session.token, oldPassword, newPassword });
  if (data.status === 'ok') {
    statusEl.style.color = 'var(--accent)';
    statusEl.textContent = 'パスワードを変更しました。安全のため再度ログインしてください。';
    // パスワード変更時はサーバー側で全セッションが無効化されるため、フロントのセッションも破棄する
    clearSession();
    setTimeout(() => { closeModals(); showLogin(); }, 1200);
  } else {
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = data.message || '変更に失敗しました。';
  }
}

/* ==============================
   地図
   ============================== */
const map = L.map('map').setView([35.681236, 139.767125], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

let selectedLatLng = null;
let selectionMarker = null;
map.on('click', (e) => {
  selectedLatLng = e.latlng;
  document.getElementById('latlngDisplay').value = `緯度 ${e.latlng.lat.toFixed(5)} / 経度 ${e.latlng.lng.toFixed(5)}`;
  if (selectionMarker) selectionMarker.setLatLng(e.latlng);
  else selectionMarker = L.marker(e.latlng, { opacity: 0.7 }).addTo(map);
});

/* ==============================
   写真選択・自動リサイズ
   ============================== */
let selectedPhotoDataUrl = null; // リサイズ後のJPEG data URL(送信用)
const MAX_ORIGINAL_PHOTO_BYTES = 20 * 1024 * 1024; // 20MB(選択直後の元ファイルサイズの上限)
const TARGET_PHOTO_BYTES = 700 * 1024; // 送信data URLの目標上限(約700KB)

const photoInput = document.getElementById('photoInput');
const photoPreviewWrap = document.getElementById('photoPreviewWrap');
const photoPreview = document.getElementById('photoPreview');
const photoProcessing = document.getElementById('photoProcessing');

photoInput.addEventListener('change', async () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    photoProcessing.textContent = '画像ファイルを選択してください。';
    photoInput.value = '';
    return;
  }
  if (file.size > MAX_ORIGINAL_PHOTO_BYTES) {
    photoProcessing.textContent = 'ファイルサイズが大きすぎます(20MBまで)。';
    photoInput.value = '';
    return;
  }

  photoProcessing.textContent = '写真を処理しています...';
  try {
    selectedPhotoDataUrl = await resizeImageToDataUrl(file);
    photoPreview.src = selectedPhotoDataUrl;
    photoPreviewWrap.style.display = 'flex';
    photoProcessing.textContent = '';
  } catch (e) {
    console.error('写真の処理に失敗しました', e);
    photoProcessing.textContent = '写真の処理に失敗しました。別の写真をお試しください。';
    selectedPhotoDataUrl = null;
  }
});

function clearSelectedPhoto() {
  selectedPhotoDataUrl = null;
  photoInput.value = '';
  photoPreviewWrap.style.display = 'none';
  photoPreview.src = '';
  photoProcessing.textContent = '';
}

// ファイルをJPEGに変換しつつ、長辺1280px程度・約700KB以下を目安に段階的に縮小する
async function resizeImageToDataUrl(file) {
  const [dataUrl, orientation] = await Promise.all([readFileAsDataUrl(file), getExifOrientation(file)]);
  const img = await loadImage(dataUrl);

  let maxDim = 1280;
  let quality = 0.82;
  let result = drawResizedJpeg(img, orientation, maxDim, quality);

  for (let attempt = 0; attempt < 4; attempt++) {
    const approxBytes = Math.ceil(result.length * 3 / 4);
    if (approxBytes <= TARGET_PHOTO_BYTES || (maxDim <= 640 && quality <= 0.5)) break;
    quality = Math.max(0.5, quality - 0.15);
    maxDim = Math.max(640, Math.round(maxDim * 0.85));
    result = drawResizedJpeg(img, orientation, maxDim, quality);
  }
  return result;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image load failed'));
    img.src = src;
  });
}

// スマートフォン写真の向き情報(EXIF Orientation)を読み取る。取得できない場合は1(補正なし)を返す。
function getExifOrientation(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const view = new DataView(e.target.result);
        if (view.getUint16(0, false) !== 0xFFD8) { resolve(1); return; }
        const length = view.byteLength;
        let offset = 2;
        while (offset < length) {
          const marker = view.getUint16(offset, false);
          offset += 2;
          if (marker === 0xFFE1) {
            if (view.getUint32(offset + 2, false) !== 0x45786966) { resolve(1); return; }
            const tiffOffset = offset + 8;
            const little = view.getUint16(tiffOffset, false) === 0x4949;
            const firstIFDOffset = view.getUint32(tiffOffset + 4, little);
            let ifdOffset = tiffOffset + firstIFDOffset;
            const tags = view.getUint16(ifdOffset, little);
            ifdOffset += 2;
            for (let i = 0; i < tags; i++) {
              const tagOffset = ifdOffset + i * 12;
              if (view.getUint16(tagOffset, little) === 0x0112) {
                resolve(view.getUint16(tagOffset + 8, little));
                return;
              }
            }
            resolve(1); return;
          } else if ((marker & 0xFF00) !== 0xFF00) {
            break;
          } else {
            offset += view.getUint16(offset, false);
          }
        }
      } catch (e) { /* パース失敗時は補正なしにフォールバック */ }
      resolve(1);
    };
    reader.onerror = () => resolve(1);
    reader.readAsArrayBuffer(file.slice(0, 128 * 1024));
  });
}

function drawResizedJpeg(img, orientation, maxDim, quality) {
  let width = img.naturalWidth || img.width;
  let height = img.naturalHeight || img.height;
  if (width > maxDim || height > maxDim) {
    if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
    else { width = Math.round(width * maxDim / height); height = maxDim; }
  }

  const swap = orientation >= 5 && orientation <= 8;
  const canvas = document.createElement('canvas');
  canvas.width = swap ? height : width;
  canvas.height = swap ? width : height;
  const ctx = canvas.getContext('2d');

  switch (orientation) {
    case 2: ctx.transform(-1, 0, 0, 1, canvas.width, 0); break;
    case 3: ctx.transform(-1, 0, 0, -1, canvas.width, canvas.height); break;
    case 4: ctx.transform(1, 0, 0, -1, 0, canvas.height); break;
    case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
    case 6: ctx.transform(0, 1, -1, 0, canvas.height, 0); break;
    case 7: ctx.transform(0, -1, -1, 0, canvas.height, canvas.width); break;
    case 8: ctx.transform(0, -1, 1, 0, 0, canvas.width); break;
    default: break;
  }

  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

function toYoutubeEmbed(url) {
  try {
    const u = new URL(url);
    let id = null;
    if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
    else if (u.hostname.includes('youtube.com')) id = u.searchParams.get('v');
    return id ? `https://www.youtube.com/embed/${id}` : null;
  } catch (e) { return null; }
}

async function loadPins() {
  try {
    const res = await fetch(API_URL, { method: 'GET' });
    const data = await res.json();
    if (data.status !== 'ok') return;

    // 既存マーカーをクリア(ログイン状態変化で編集ボタン表示を切替えるため再描画)
    map.eachLayer(layer => { if (layer instanceof L.Marker && layer !== selectionMarker) map.removeLayer(layer); });

    data.pins.forEach(pin => {
      const marker = L.marker([pin.lat, pin.lng]).addTo(map);
      const container = buildPopupContent(pin);
      marker.bindPopup(container, { maxWidth: 260 });
    });
  } catch (e) {
    console.error('ピンの読み込みに失敗しました', e);
  }
}

function buildPopupContent(pin) {
  const container = document.createElement('div');

  const nick = document.createElement('div');
  nick.className = 'popup-nickname';
  nick.textContent = '投稿者: ' + pin.nickname;
  container.appendChild(nick);

  const embedUrl = toYoutubeEmbed(pin.videoUrl);
  if (embedUrl) {
    const iframe = document.createElement('iframe');
    iframe.width = '220'; iframe.height = '124'; iframe.style.border = '0';
    iframe.src = embedUrl; iframe.setAttribute('allowfullscreen', '');
    container.appendChild(iframe);
  }

  if (pin.photoUrl) {
    const photoWrap = document.createElement('div');
    photoWrap.className = 'popup-photo';
    const photoImg = document.createElement('img');
    photoImg.src = pin.photoUrl;
    photoImg.alt = '投稿された写真';
    photoImg.loading = 'lazy';
    photoImg.onclick = () => window.open(pin.photoUrl, '_blank', 'noopener');
    photoWrap.appendChild(photoImg);
    container.appendChild(photoWrap);
  }

  const desc = document.createElement('div');
  desc.textContent = pin.description; // textContentで安全に挿入
  container.appendChild(desc);

  const link = document.createElement('a');
  if (pin.videoUrl) {
    link.href = pin.videoUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.className = 'video-link'; link.textContent = '投稿元を見る ↗';
    container.appendChild(link);
  }

  // 編集・削除ボタン(表示はログイン中の全員に出し、権限はサーバー側で最終判定)
  const actions = document.createElement('div');
  actions.className = 'popup-actions';
  const editBtn = document.createElement('button');
  editBtn.textContent = '編集'; editBtn.className = 'link-btn';
  editBtn.onclick = () => editPost(pin);
  const delBtn = document.createElement('button');
  delBtn.textContent = '削除'; delBtn.className = 'danger';
  delBtn.onclick = () => deletePost(pin.postId);
  if (session && session.token) {
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    container.appendChild(actions);
  }

  // ---- コメント欄 ----
  const commentsWrap = document.createElement('div');
  commentsWrap.className = 'comments-wrap';

  const commentsTitle = document.createElement('div');
  commentsTitle.className = 'comments-title';
  commentsTitle.textContent = `コメント (${pin.comments.length})`;
  commentsWrap.appendChild(commentsTitle);

  const list = document.createElement('div');
  list.className = 'comments-list';
  pin.comments.forEach(c => list.appendChild(buildCommentRow(c, pin.postId)));
  commentsWrap.appendChild(list);

  if (session && session.token) {
    const form = document.createElement('div');
    form.className = 'comment-form';
    const textarea = document.createElement('textarea');
    textarea.maxLength = 300;
    textarea.placeholder = 'コメントを入力...';
    const btn = document.createElement('button');
    btn.className = 'link-btn';
    btn.textContent = 'コメントする';
    btn.onclick = async () => {
      const text = textarea.value.trim();
      if (!text) return;
      btn.disabled = true;
      const data = await api('addComment', { token: session.token, postId: pin.postId, comment: text });
      btn.disabled = false;
      if (data.status === 'ok') { loadPins(); }
      else alert(data.message || 'コメントの投稿に失敗しました。');
    };
    form.appendChild(textarea);
    form.appendChild(btn);
    commentsWrap.appendChild(form);
  } else {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'コメントするにはログインしてください。';
    commentsWrap.appendChild(hint);
  }

  container.appendChild(commentsWrap);
  return container;
}

function buildCommentRow(c, postId) {
  const row = document.createElement('div');
  row.className = 'comment-row';

  const meta = document.createElement('div');
  meta.className = 'comment-meta';
  meta.textContent = c.nickname;
  row.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'comment-body';
  body.textContent = c.comment; // textContentで安全に挿入
  row.appendChild(body);

  if (session && session.token) {
    const actions = document.createElement('div');
    actions.className = 'comment-actions';

    const editBtn = document.createElement('button');
    editBtn.textContent = '編集'; editBtn.className = 'link-btn';
    editBtn.onclick = async () => {
      const newText = prompt('コメントを編集', c.comment);
      if (newText === null) return;
      const data = await api('updateComment', { token: session.token, commentId: c.commentId, comment: newText });
      if (data.status === 'ok') loadPins();
      else alert(data.message || '編集に失敗しました(権限がない可能性があります)');
    };

    const delBtn = document.createElement('button');
    delBtn.textContent = '削除'; delBtn.className = 'danger';
    delBtn.onclick = async () => {
      if (!confirm('このコメントを削除しますか?')) return;
      const data = await api('deleteComment', { token: session.token, commentId: c.commentId });
      if (data.status === 'ok') loadPins();
      else alert(data.message || '削除に失敗しました(権限がない可能性があります)');
    };

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(actions);
  }

  return row;
}

async function editPost(pin) {
  const newUrl = prompt('動画URLを編集', pin.videoUrl);
  if (newUrl === null) return;
  const newDesc = prompt('説明文を編集(200文字まで)', pin.description);
  if (newDesc === null) return;

  const data = await api('updatePost', { token: session.token, postId: pin.postId, videoUrl: newUrl, description: newDesc });
  if (data.status === 'ok') loadPins();
  else alert(data.message || '編集に失敗しました(権限がない可能性があります)');
}

async function deletePost(postId) {
  if (!confirm('この投稿を削除しますか?')) return;
  const data = await api('deletePost', { token: session.token, postId });
  if (data.status === 'ok') loadPins();
  else alert(data.message || '削除に失敗しました(権限がない可能性があります)');
}

/* ==============================
   投稿フォーム送信
   ============================== */
const form = document.getElementById('postForm');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = ''; statusEl.className = '';

  if (!session || !session.token) {
    statusEl.textContent = 'ログインしてください。'; statusEl.className = 'error'; return;
  }
  if (!selectedLatLng) {
    statusEl.textContent = '地図をクリックして位置を選択してください。'; statusEl.className = 'error'; return;
  }

  const videoUrl = document.getElementById('videoUrl').value.trim();
  const description = document.getElementById('description').value.trim();
  const hp = document.getElementById('hp').value;

  if (!videoUrl && !selectedPhotoDataUrl) {
    statusEl.textContent = '動画URLまたは写真のどちらかを入力してください。'; statusEl.className = 'error'; return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = '送信中...';

  const data = await api('createPost', {
    token: session.token, lat: selectedLatLng.lat, lng: selectedLatLng.lng, videoUrl, description, hp,
    photoBase64: selectedPhotoDataUrl || undefined
  });

  if (data.status === 'ok') {
    statusEl.textContent = '投稿しました。'; statusEl.className = 'ok';
    form.reset();
    clearSelectedPhoto();
    if (selectionMarker) { map.removeLayer(selectionMarker); selectionMarker = null; }
    selectedLatLng = null;
    loadPins();
  } else {
    statusEl.textContent = data.message || (data.message === 'session expired. please login again.' ? 'セッションが切れました。再ログインしてください。' : '投稿に失敗しました。');
    statusEl.className = 'error';
    if (data.message && data.message.indexOf('session') !== -1) clearSession();
  }
  submitBtn.disabled = false;
});

/* ==============================
   初期化
   ============================== */
renderAuthArea();
loadPins();
</script>
