<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>くるま旅マップ | 車中泊・キャンプスポット共有マップ</title>
<meta name="description" content="車中泊・キャンプスポットをみんなで共有するオープンなマップ。データはGitHubで管理しています。" />

<!-- Leaflet (APIキー不要・オープンソース) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Leaflet.markercluster（大量スポットでも地図描画を軽快にするクラスタリング） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts: 丸ゴシック（道路標識的な親しみ）＋ 本文用 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          pine:    '#16352B',  // 深い松の緑（基調）
          pinedim: '#2C5446',
          mist:    '#F2F5F1',  // 朝靄の白
          lantern: '#E8A33D',  // ランタンの灯（アクセント）
          nightsky:'#0E1F1A',
        },
        fontFamily: {
          maru: ['"Zen Maru Gothic"', 'sans-serif'],
          body: ['"Noto Sans JP"', 'sans-serif'],
        },
      }
    }
  }
</script>

<style>
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: 'Noto Sans JP', sans-serif; }
  #map { width: 100%; height: 100%; background: #DCE6DE; }

  /* ===== カスタムピン（ティアドロップ型バッジ） ===== */
  .pin {
    width: 34px; height: 34px;
    border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(14,31,26,.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .pin span {
    transform: rotate(45deg);
    font-size: 15px; line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.2));
  }
  .leaflet-marker-icon:hover .pin { transform: rotate(-45deg) scale(1.12); }

  /* ===== Leafletポップアップの調整 ===== */
  .leaflet-popup-content-wrapper {
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(14,31,26,.25);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .leaflet-popup-content { margin: 14px 16px; min-width: 220px; }

  /* 閉じるボタン(×)を大きく・押しやすく。画面端ギリギリで押しにくい/見えにくい問題の対策 */
  .leaflet-popup-close-button {
    top: 6px !important;
    right: 6px !important;
    width: 30px !important;
    height: 30px !important;
    line-height: 28px !important;
    font-size: 20px !important;
    font-weight: bold;
    text-align: center;
    color: #16352B !important;
    background: #fff;
    border: 1.5px solid rgba(22,53,43,.15);
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(14,31,26,.2);
  }
  .leaflet-popup-close-button:hover {
    background: #F4F1E8;
    color: #16352B !important;
  }

  /* スマホのボトムシート(z-1100)の下にポップアップが隠れて「一瞬出てすぐ消える」ように
     見えてしまう不具合の対策：Leafletのポップアップ/マーカーをシートより手前に表示する */
  .leaflet-popup-pane, .leaflet-marker-pane, .leaflet-tooltip-pane {
    z-index: 1150;
  }

  /* ===== モバイル：ボトムシート ===== */
  #sheet {
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
    touch-action: none;
    will-change: transform;
  }
  .sheet-handle { width: 44px; height: 5px; border-radius: 99px; }

  /* フィルターチップの横スクロール（スクロールバー非表示） */
  .chips { -ms-overflow-style: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }

  /* リスト項目の選択状態 */
  .spot-card.active { border-color: #E8A33D; background: #FDF6EA; }

  /* キーボードフォーカス可視化 */
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid #E8A33D; outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #sheet, .pin { transition: none; }
  }

  /* ===== 会員機能：モーダル・フォーム ===== */
  .auth-input {
    width: 100%; border-radius: 10px; border: 2px solid rgba(22,53,43,.15);
    padding: 9px 12px; font-size: 14px; background: #fff;
  }
  .auth-input:focus { outline: none; border-color: #E8A33D; }
  .auth-label { display:block; font-size: 12px; font-weight: 700; color: #16352B; margin-bottom: 4px; }
  .auth-btn-primary {
    width: 100%; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px;
    color: #fff; background: #16352B; transition: filter .15s;
  }
  .auth-btn-primary:hover { filter: brightness(1.15); }
  .auth-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .auth-btn-link { font-size: 12px; color: #B97F25; font-weight: 700; text-decoration: underline; }
  .auth-error { font-size: 12px; color: #C4604F; font-weight: 700; min-height: 16px; }
  .pw-field { position: relative; }
  .pw-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: #16352B99; background: none; border: none; cursor: pointer; padding: 4px;
  }
  .comment-item { border-top: 1px solid rgba(22,53,43,.08); padding: 8px 0; }
  .comment-item:first-child { border-top: none; }

  /* Tailwindのflex等のdisplayユーティリティが hidden 属性より優先されてしまう問題の対策 */
  [hidden] { display: none !important; }
</style>
</head>

<body class="bg-mist text-pine">

<div class="h-full flex flex-col">

  <!-- ===== ヘッダー ===== -->
  <header class="shrink-0 bg-pine text-mist px-4 py-2.5 flex items-center gap-3 z-[1200] shadow-md">
    <!-- 道路標識風ロゴ -->
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-lantern flex items-center justify-center font-maru font-black text-pine text-lg select-none" aria-hidden="true">旅</div>
      <div class="leading-tight">
        <h1 class="font-maru font-bold text-base sm:text-lg tracking-wide">くるま旅マップ</h1>
        <p class="text-[10px] sm:text-[11px] text-mist/70 hidden sm:block">車中泊・キャンプスポット共有マップ</p>
      </div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span id="spot-count" class="text-xs bg-pinedim rounded-full px-3 py-1 font-medium" aria-live="polite">読込中…</span>
      <div id="auth-area" class="flex items-center gap-1.5"></div>
    </div>
  </header>

  <!-- ===== 本体（PC: 2カラム / スマホ: マップ全面） ===== -->
  <div class="flex-1 relative flex overflow-hidden">

    <!-- ── PCサイドバー ── -->
    <aside class="hidden md:flex md:flex-col w-[380px] shrink-0 bg-white border-r border-pine/10 z-[1100]">
      <div class="p-4 border-b border-pine/10 space-y-3">
        <div class="relative">
          <input id="search-input" type="search" placeholder="スポット名・説明で検索…" aria-label="スポットを検索"
            class="auth-input !pl-8" />
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-pine/40 text-sm" aria-hidden="true">🔍</span>
        </div>
        <p class="font-maru font-bold text-sm">カテゴリで絞り込む</p>
        <div id="cat-filters-pc" class="flex flex-wrap gap-2"></div>
        <p class="font-maru font-bold text-sm pt-1">設備で絞り込む</p>
        <div id="fac-filters-pc" class="flex flex-wrap gap-2"></div>
        <button id="fav-filter-btn-pc" type="button" hidden onclick="toggleFavoritesFilter()"
          class="w-full flex items-center justify-center gap-1.5 rounded-full border-2 px-3 py-1.5 text-xs font-bold font-maru transition-all bg-white" style="border-color:rgba(22,53,43,.15)">
          ⭐ お気に入りのみ表示
        </button>
        <button id="visit-filter-btn-pc" type="button" hidden onclick="toggleVisitedFilter()"
          class="w-full flex items-center justify-center gap-1.5 rounded-full border-2 px-3 py-1.5 text-xs font-bold font-maru transition-all bg-white" style="border-color:rgba(22,53,43,.15)">
          🚗 行った記録のみ表示
        </button>
      </div>
      <div id="spot-list-pc" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </aside>

    <!-- ── マップ ── -->
    <main class="flex-1 relative">
      <div id="map" role="application" aria-label="スポットマップ"></div>

      <!-- スマホ：上部検索バー＋フィルターチップ -->
      <div id="mobile-search-overlay" class="md:hidden absolute top-2 left-0 right-0 z-[1000] px-2 space-y-1.5">
        <div class="relative">
          <input id="search-input-sp" type="search" placeholder="スポット名・説明で検索…" aria-label="スポットを検索"
            class="auth-input !pl-8 !bg-white shadow-md" />
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-pine/40 text-sm" aria-hidden="true">🔍</span>
        </div>
        <div id="cat-filters-sp" class="chips flex gap-2 overflow-x-auto pb-1"></div>
      </div>

      <!-- 現在地ボタン -->
      <button id="locate-btn" aria-label="現在地を表示"
        class="absolute bottom-28 md:bottom-6 right-3 md:right-4 z-[1000] w-12 h-12 rounded-full bg-white shadow-lg border border-pine/15 flex items-center justify-center text-xl hover:bg-mist active:scale-95 transition">
        📍
      </button>

      <!-- ⑧周遊ルートボタン（1件以上追加されたら表示） -->
      <button id="route-fab" aria-label="周遊ルート" hidden onclick="openRouteModal()"
        class="absolute bottom-28 md:bottom-6 left-3 md:left-4 z-[1000] h-12 pl-3 pr-4 rounded-full bg-pine text-white shadow-lg flex items-center gap-1.5 text-sm font-bold font-maru hover:brightness-110 active:scale-95 transition">
        🗺️ ルート <span class="route-count bg-lantern rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center text-[11px]">0</span>
      </button>

      <!-- スポット投稿ボタン（会員ログイン時のみ表示） -->
      <button id="post-spot-btn" aria-label="スポットを投稿" hidden
        class="absolute bottom-44 md:bottom-24 right-3 md:right-4 z-[1000] h-12 pl-3 pr-4 rounded-full bg-lantern text-white shadow-lg flex items-center gap-1.5 text-sm font-bold font-maru hover:brightness-105 active:scale-95 transition">
        <span class="text-lg leading-none">📍+</span>投稿する
      </button>
    </main>
  </div>
</div>

<!-- ===== スマホ：ボトムシート ===== -->
<div id="sheet"
     class="md:hidden fixed left-0 right-0 bottom-0 z-[1100] bg-white rounded-t-2xl shadow-[0_-8px_30px_rgba(14,31,26,.2)]"
     style="height: 85vh; transform: translateY(calc(85vh - 96px));">
  <div id="sheet-grip" class="pt-2.5 pb-1 flex flex-col items-center cursor-grab select-none">
    <div class="sheet-handle bg-pine/20"></div>
    <p class="font-maru font-bold text-sm mt-1.5">スポット一覧 <span id="sheet-count" class="text-lantern"></span></p>
  </div>
  <div class="px-3 pb-2 flex items-center gap-2">
    <div id="fac-filters-sp" class="chips flex gap-2 overflow-x-auto flex-1"></div>
    <button id="fav-filter-btn-sp" type="button" hidden onclick="toggleFavoritesFilter()"
      class="shrink-0 rounded-full border-2 px-2.5 py-1 text-[11px] font-bold transition-all bg-white" style="border-color:rgba(22,53,43,.15)">
      ⭐
    </button>
    <button id="visit-filter-btn-sp" type="button" hidden onclick="toggleVisitedFilter()"
      class="shrink-0 rounded-full border-2 px-2.5 py-1 text-[11px] font-bold transition-all bg-white" style="border-color:rgba(22,53,43,.15)">
      🚗
    </button>
  </div>
  <div id="spot-list-sp" class="overflow-y-auto px-3 pb-24 space-y-2" style="height: calc(85vh - 96px);"></div>
</div>

<!-- ===== 会員機能：共通モーダル ===== -->
<div id="modal-overlay" hidden
     class="fixed inset-0 z-[1400] bg-nightsky/60 flex items-center justify-center p-4">
  <div id="modal-box"
       class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 sm:p-6 relative">
  </div>
</div>

<!-- 地図クリックでの位置選択中に表示するバナー -->
<div id="map-pick-banner" hidden
     class="fixed top-3 left-1/2 -translate-x-1/2 z-[1450] bg-pine text-white rounded-full shadow-lg pl-4 pr-1.5 py-1.5 flex items-center gap-2 text-xs sm:text-sm font-bold font-maru">
  📍 地図をタップして位置を選択してください
  <button type="button" onclick="cancelMapPickLocation()" class="bg-white/20 hover:bg-white/30 rounded-full px-3 py-1 text-xs">キャンセル</button>
</div>

<!-- データ読込に失敗した場合の警告バナー -->
<div id="data-load-warning" hidden
     class="fixed top-3 left-1/2 -translate-x-1/2 z-[1450] bg-[#C4604F] text-white rounded-full shadow-lg pl-4 pr-1.5 py-1.5 flex items-center gap-2 text-xs sm:text-sm font-bold font-maru max-w-[92vw]">
  ⚠️ <span>一部のデータを読み込めませんでした</span>
  <button type="button" onclick="location.reload()" class="bg-white/20 hover:bg-white/30 rounded-full px-3 py-1 text-xs shrink-0">再読込</button>
  <button type="button" onclick="document.getElementById('data-load-warning').hidden = true" class="bg-white/20 hover:bg-white/30 rounded-full px-2 py-1 text-xs shrink-0" aria-label="閉じる">✕</button>
</div>

<script>
/* =====================================================================
 * 設定
 * ===================================================================== */
const CONFIG = {
  dataUrl: 'spots.json',
  // 「この情報を修正する」リンク先（ご自身のリポジトリに変更してください）
  githubEditUrl: 'https://github.com/kenken6291/shachu-haku/edit/main/spots.json',
  initialView: { lat: 36.2, lng: 138.25, zoom: 6 }, // 日本全体
  // GASウェブアプリのURL（Code.gs をデプロイして発行されたURLに置き換えてください）
  gasUrl: 'https://script.google.com/macros/s/AKfycbyKm4WC6C-EXBpe-DBji5zPcWfMuZiVovTZPV3L346Hh5wBIwpL7aa1WWEiyZQ0JMHplg/exec',
};

const TERMS_TEXT = `【ご利用にあたっての注意事項】
・投稿できる情報は、実際に訪問・確認した内容としてください。
・私有地や許可のない場所への駐車・宿泊を助長する投稿は禁止です。
・現地のルール、マナー、条例を必ず遵守してください。
・他の利用者への誹謗中傷、個人情報の掲載は禁止です。

【免責事項】
・掲載されている情報の正確性・最新性は保証されません。ご利用の際は必ず現地の最新情報をご確認ください。
・本サービスの利用により生じたいかなる損害についても、運営者は責任を負いません。
・投稿内容は運営者の判断により、予告なく編集・削除する場合があります。`;

const CATEGORIES = {
  michinoeki: { label: '道の駅',     icon: '🛣️', color: '#E8A33D' },
  rvpark:     { label: 'RVパーク',   icon: '🚐', color: '#3B82A0' },
  camp:       { label: 'キャンプ場', icon: '⛺', color: '#4C8C5C' },
  view:       { label: '絶景スポット', icon: '🌄', color: '#7C6BAE' },
  onsen:      { label: '温泉・入浴', icon: '♨️', color: '#C4604F' },
  parking:    { label: '駐車場',     icon: '🅿️', color: '#6B7280' },
  izakaya:    { label: '車中泊で行ける居酒屋', icon: '🏮', color: '#B23A48' },
};

const FACILITIES = {
  toilet: { label: 'トイレ', icon: '🚻' },
  power:  { label: '電源',   icon: '🔌' },
  bath:   { label: '入浴',   icon: '🛁' },
  shop:   { label: '売店',   icon: '🏪' },
  wifi:   { label: 'Wi-Fi',  icon: '📶' },
  dump:   { label: 'ゴミ処理', icon: '🗑️' },
};

const SLEEP_STATUS = {
  ok:      { label: '車中泊OK',   icon: '🅾️', bg: '#E7F4EA', fg: '#2F7A44' },
  ng:      { label: '車中泊不可', icon: '❌', bg: '#FBEAEA', fg: '#C4604F' },
  unclear: { label: '要確認',     icon: '❓', bg: '#F5F1E3', fg: '#B97F25' },
};
function sleepStatusOf(spot) {
  return SLEEP_STATUS[spot.sleepStatus] ? spot.sleepStatus : 'unclear';
}

/* カテゴリ絞り込みの取りこぼし対策：
 * スプレッドシートへの手動貼り付け・一括インポート等で category セルに
 * 前後の空白やラベル文字列（キー名ではなく「車中泊で行ける居酒屋」等）が
 * 入ってしまうと、フィルターチップ側のキー('izakaya'等)と一致せず
 * 絞り込みで表示されなくなる。読み込み時に正規化しておく。 */
const CATEGORY_LABEL_TO_KEY = Object.fromEntries(
  Object.entries(CATEGORIES).map(([k, c]) => [c.label, k])
);
function normalizeCategoryValue(raw) {
  const v = (raw == null ? '' : String(raw)).trim();
  if (CATEGORIES[v]) return v;
  if (CATEGORY_LABEL_TO_KEY[v]) return CATEGORY_LABEL_TO_KEY[v];
  return v; // 未知のカテゴリはそのまま（該当チップが無く「駐車場アイコン」等でフォールバック表示）
}
function normalizeSpotList(list) {
  return list.map(s => ({ ...s, category: normalizeCategoryValue(s.category), tel: s.tel == null ? '' : String(s.tel) }));
}

/* ⑥ Googleドライブに保存した写真の表示URL（サムネイル/拡大表示） */
function drivePhotoUrl(fileId, size = 400) {
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w${size}`;
}
const MAX_PHOTOS_PER_SPOT = 3;

/* =====================================================================
 * 状態
 * ===================================================================== */
let allSpots = [];
let markers = {};            // id -> L.Marker
const activeCats = new Set(Object.keys(CATEGORIES)); // 初期は全カテゴリON
const activeFacs = new Set();                        // AND条件（空なら無視）
let searchQuery = '';                                // ①名称・説明のテキスト検索
let showFavoritesOnly = false;                        // ⑦お気に入りのみ表示
let showVisitedOnly = false;                           // ⑪行った記録のみ表示
let favoriteSpotIds = new Set();                      // ⑦ログイン中会員のお気に入りスポットID
let visits = [];                                       // ⑪ログイン中会員の「行った記録」一覧 {id,spotId,visitedDate,note,createdAt,updatedAt}
let spotStats = {};                                    // ⑩ spotId -> { avg, count }（コメントの平均評価）
let routeSpots = [];                                   // ⑧周遊ルートに追加したスポット（順序つき）
let pendingPhotoFiles = [];                            // ⑥投稿フォームで選択中（未アップロード）の写真ファイル
let currentEditingSpotPhotosCount = 0;                 // ⑥編集中スポットの既存写真枚数（上限チェック用）

/* ===== 会員機能：状態 ===== */
const auth = { token: null, userId: null, nickname: null, mustChangePassword: false };

/* =====================================================================
 * マップ初期化（OpenStreetMap：APIキー不要）
 * ===================================================================== */
const map = L.map('map', {
  zoomControl: false,
  tap: true,
}).setView([CONFIG.initialView.lat, CONFIG.initialView.lng], CONFIG.initialView.zoom);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

/* 大量スポットでも軽快に動くよう、個別マーカーではなくクラスタリング表示にする */
const markerClusterGroup = L.markerClusterGroup({
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  chunkedLoading: true, // 追加処理を分割してUIブロックを防ぐ
});
map.addLayer(markerClusterGroup);
const LIST_RENDER_LIMIT = 300; // サイドバー/シートの一覧はこの件数まで表示（地図上のマーカーは全件表示）

/* =====================================================================
 * データ読込（fetch失敗時はサンプルデータにフォールバック）
 * ===================================================================== */
const SAMPLE_DATA = {
  spots: [
    { id: 'sample-001', name: '道の駅 みさと高原（サンプル）', category: 'michinoeki',

async function loadSpots() {
  try {
    const res = await fetch(CONFIG.dataUrl, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allSpots = normalizeSpotList(data.spots || []).map(s => ({ ...s, source: 'static' }));
  } catch (e) {
    console.warn('spots.json の読込に失敗したため、サンプルデータを表示します:', e.message);
    allSpots = normalizeSpotList(SAMPLE_DATA.spots).map(s => ({ ...s, source: 'static' }));
    showDataLoadWarning();
  }

  try {
    let memberSpots;
    try {
      memberSpots = await loadMemberSpots();
    } catch (e1) {
      console.warn('会員投稿スポットの読込に失敗、再試行します:', e1.message);
      await new Promise(r => setTimeout(r, 1500));
      memberSpots = await loadMemberSpots(); // 通信の一時的な失敗に備えて1回だけ再試行
    }
    allSpots = allSpots.concat(memberSpots);
  } catch (e) {
    console.warn('会員投稿スポットの読込に失敗しました（再試行後も失敗）:', e.message);
    showDataLoadWarning();
  }

  await loadSpotStats();      // ⑩平均評価
  if (auth.token) { await loadFavorites(); await loadVisits(); } // ⑦お気に入り・⑪行った記録（ログイン済みの場合）
  loadRouteFromStorage();      // ⑧周遊ルート（端末に保存済みのもの）
  updateRouteButton();
  syncFavFilterButton();
  syncVisitFilterButton();

  buildFilters();
  render();
}

function showDataLoadWarning() {
  const el = document.getElementById('data-load-warning');
  if (el) el.hidden = false;
}

/* ⑩ スポットごとの平均評価を取得 */
async function loadSpotStats() {

}

/* ⑦ ログイン中会員のお気に入りスポットIDを取得 */
async function loadFavorites() {
  if (!auth.token) { favoriteSpotIds = new Set(); return; }
  try {

/* ⑪ ログイン中会員の「行った記録」一覧を取得 */
async function loadVisits() {
  if (!auth.token) { visits = []; return; }
  try {
    const res = await callApi('listVisits', { token: auth.token });
    visits = res.ok ? res.visits : [];
  } catch (e) {
    visits = [];
  }
}

function visitsForSpot(spotId) {
  return visits.filter(v => v.spotId === spotId)
    .sort((a, b) => (b.visitedDate || '').localeCompare(a.visitedDate || ''));
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// サーバー側で日付型に自動変換されISO形式("2026-09-21T15:00:00.000Z"等)で
// 返ってきた場合でも、先頭の yyyy-MM-dd 部分だけを取り出して表示する保険
function formatVisitDate(v) {
  const s = String(v || '');
  const m = s.match(/^\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : s;
}

function visitListHtml(spotId) {
  const list = visitsForSpot(spotId);
  if (!list.length) return `<p class="text-[11px] text-gray-400">まだ記録がありません。</p>`;
  return list.map(v => `
    <div class="flex items-start justify-between gap-2 text-[11px] py-1 border-b border-pine/5 last:border-0">
      <div class="min-w-0">
        <p class="font-bold text-pine">${esc(formatVisitDate(v.visitedDate))}</p>
        ${v.note ? `<p class="text-gray-600 whitespace-pre-wrap">${esc(v.note)}</p>` : ''}
      </div>
      <span class="shrink-0 flex gap-2">
        <button type="button" class="auth-btn-link !text-[10px]" onclick="handleEditVisit('${spotId}','${v.id}')">編集</button>
        <button type="button" class="auth-btn-link !text-[10px]" style="color:#C4604F" onclick="handleDeleteVisit('${spotId}','${v.id}')">削除</button>
      </span>
    </div>`).join('');
}

async function handleAddVisit(spotId) {
  if (!auth.token) { openLoginModal(); return; }
  const dateInput = prompt('訪問日を入力してください（例: ' + todayStr() + '）', todayStr());
  if (dateInput === null) return;
  const visitedDate = dateInput.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(visitedDate)) { alert('日付は YYYY-MM-DD の形式で入力してください。'); return; }
  const note = prompt('メモ（任意）', '') || '';
  try {
    const res = await callApi('addVisit', { token: auth.token, spotId, visitedDate, note: note.trim() });
    if (!res.ok) { alert('記録に失敗しました。'); return; }
    await loadVisits();
    refreshOpenPopupContent(spotId);
    updateSpotCardInPlace(spotId);
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

async function handleEditVisit(spotId, visitId) {
  const v = visits.find(x => x.id === visitId);
  if (!v) return;
  const dateInput = prompt('訪問日を編集', formatVisitDate(v.visitedDate) || todayStr());
  if (dateInput === null) return;
  const visitedDate = dateInput.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(visitedDate)) { alert('日付は YYYY-MM-DD の形式で入力してください。'); return; }
  const note = prompt('メモを編集', v.note || '');
  if (note === null) return;
  try {
    const res = await callApi('updateVisit', { token: auth.token, visitId, visitedDate, note: note.trim() });
    if (!res.ok) { alert('編集に失敗しました。'); return; }
    await loadVisits();
    refreshOpenPopupContent(spotId);
    updateSpotCardInPlace(spotId);
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

async function handleDeleteVisit(spotId, visitId) {
  if (!confirm('この「行った記録」を削除しますか？')) return;
  try {
    const res = await callApi('deleteVisit', { token: auth.token, visitId });
    if (!res.ok) { alert('削除に失敗しました。'); return; }
    await loadVisits();
    refreshOpenPopupContent(spotId);
    updateSpotCardInPlace(spotId);
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

/* =====================================================================
 * ⑧ 周遊ルート（クライアント側のみ・端末のlocalStorageに保存）
 * ===================================================================== */
function loadRouteFromStorage() {
  try { routeSpots = JSON.parse(localStorage.getItem('kurumatabi_route') || '[]'); } catch (e) { routeSpots = []; }
}
function saveRouteToStorage() {
  localStorage.setItem('kurumatabi_route', JSON.stringify(routeSpots));
}
function isInRoute(spotId) {
  return routeSpots.some(s => s.id === spotId);
}
function updateRouteButton() {
  const btn = document.getElementById('route-fab');
  if (!btn) return;
  btn.hidden = routeSpots.length === 0;
  const countEl = btn.querySelector('.route-count');
  if (countEl) countEl.textContent = routeSpots.length;
}
function toggleRouteSpot(spotId) {
  const spot = allSpots.find(s => s.id === spotId);
  if (!spot) return;
  const idx = routeSpots.findIndex(s => s.id === spotId);
  if (idx >= 0) {
    routeSpots.splice(idx, 1);
  } else {
    if (routeSpots.length >= 10) { alert('ルートに追加できるのは10件までです。'); return; }
    routeSpots.push({ id: spot.id, name: spot.name, lat: spot.lat, lng: spot.lng });
  }
  saveRouteToStorage();
  updateRouteButton();
  refreshOpenPopupContent(spotId);
  updateSpotCardInPlace(spotId);
}
function buildRouteUrl() {
  return 'https://www.google.com/maps/dir/' + routeSpots.map(s => `${s.lat},${s.lng}`).join('/');
}
function openRouteModal() {
  openModal(routeModalHtml());
}
function routeModalHtml() {
  if (routeSpots.length === 0) {
    return `<h2 class="font-maru font-bold text-lg mb-3">🗺️ 周遊ルート</h2>
      <p class="text-sm text-gray-400">まだスポットが追加されていません。ポップアップの「🗺️＋ルートに追加」から追加してください。</p>`;
  }
  const items = routeSpots.map((s, i) => `
    <div class="flex items-center gap-2 bg-mist rounded-lg px-2.5 py-2">
      <span class="shrink-0 w-6 h-6 rounded-full bg-pine text-white text-[11px] font-bold flex items-center justify-center">${i + 1}</span>
      <p class="flex-1 min-w-0 text-sm font-medium truncate">${esc(s.name)}</p>
      <button type="button" class="shrink-0 text-pine/50 disabled:opacity-20 px-1" ${i === 0 ? 'disabled' : ''} onclick="moveRouteSpot(${i},-1)">▲</button>
      <button type="button" class="shrink-0 text-pine/50 disabled:opacity-20 px-1" ${i === routeSpots.length - 1 ? 'disabled' : ''} onclick="moveRouteSpot(${i},1)">▼</button>
      <button type="button" class="shrink-0 px-1" style="color:#C4604F" onclick="removeRouteSpot(${i})">✕</button>
    </div>`).join('');
  return `
    <h2 class="font-maru font-bold text-lg mb-3">🗺️ 周遊ルート（${routeSpots.length}件）</h2>
    <div class="space-y-1.5 max-h-[50vh] overflow-y-auto">${items}</div>
    <div class="flex gap-2 mt-4">
      <a href="${buildRouteUrl()}" target="_blank" rel="noopener" class="auth-btn-primary flex-1 text-center">経路を開く</a>
      <button type="button" class="auth-btn-link" style="color:#C4604F" onclick="clearRoute()">クリア</button>
    </div>`;
}
function moveRouteSpot(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= routeSpots.length) return;
  [routeSpots[idx], routeSpots[j]] = [routeSpots[j], routeSpots[idx]];
  saveRouteToStorage();
  openModal(routeModalHtml());
}
function removeRouteSpot(idx) {
  const removed = routeSpots.splice(idx, 1)[0];
  saveRouteToStorage();
  updateRouteButton();
  if (removed) { refreshOpenPopupContent(removed.id); updateSpotCardInPlace(removed.id); }
  openModal(routeModalHtml());
}
function clearRoute() {
  if (!confirm('ルートをクリアしますか？')) return;
  const ids = routeSpots.map(s => s.id);
  routeSpots = [];
  saveRouteToStorage();
  updateRouteButton();
  closeModal();
  ids.forEach(id => { refreshOpenPopupContent(id); updateSpotCardInPlace(id); });
}

/* =====================================================================
 * フィルターUI生成
 * ===================================================================== */
function catChip(key, compact = false) {
  const c = CATEGORIES[key];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.cat = key;
  btn.className = 'cat-chip shrink-0 flex items-center gap-1.5 rounded-full border-2 px-3 py-1.5 text-xs font-bold font-maru transition-all whitespace-nowrap bg-white';
  btn.innerHTML = `<span>${c.icon}</span>${c.label}`;
  btn.addEventListener('click', () => {
    activeCats.has(key) ? activeCats.delete(key) : activeCats.add(key);
    syncChipStyles(); render();
  });
  return btn;
}

function facChip(key) {
  const f = FACILITIES[key];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.fac = key;
  btn.className = 'fac-chip shrink-0 flex items-center gap-1 rounded-full border px-2.5 py-1 text-[11px] font-medium transition-all whitespace-nowrap bg-white border-pine/20 text-pine/70';
  btn.innerHTML = `<span>${f.icon}</span>${f.label}`;
  btn.addEventListener('click', () => {
    activeFacs.has(key) ? activeFacs.delete(key) : activeFacs.add(key);
    syncChipStyles(); render();
  });
  return btn;
}

function buildFilters() {
  const catPC = document.getElementById('cat-filters-pc');
  const catSP = document.getElementById('cat-filters-sp');
  const facPC = document.getElementById('fac-filters-pc');
  const facSP = document.getElementById('fac-filters-sp');
  Object.keys(CATEGORIES).forEach(k => { catPC.appendChild(catChip(k)); catSP.appendChild(catChip(k, true)); });
  Object.keys(FACILITIES).forEach(k => { facPC.appendChild(facChip(k)); facSP.appendChild(facChip(k)); });
  syncChipStyles();
  setupSearchInputs();
}

/* ① 検索ボックス（PC／スマホ同期・簡易デバウンス） */
function setupSearchInputs() {
  const inputs = [document.getElementById('search-input'), document.getElementById('search-input-sp')];
  let t = null;
  inputs.forEach(el => {
    if (!el) return;
    el.addEventListener('input', () => {
      searchQuery = el.value;
      inputs.forEach(other => { if (other && other !== el) other.value = el.value; }); // 2つの入力欄を同期
      clearTimeout(t);
      t = setTimeout(render, 150);
    });
  });
}

function syncChipStyles() {
  document.querySelectorAll('.cat-chip').forEach(btn => {
    const key = btn.dataset.cat, c = CATEGORIES[key], on = activeCats.has(key);
    btn.style.borderColor = on ? c.color : 'rgba(22,53,43,.15)';
    btn.style.background  = on ? c.color : '#fff';
    btn.style.color       = on ? '#fff'  : 'rgba(22,53,43,.55)';
    btn.setAttribute('aria-pressed', on);
  });
  document.querySelectorAll('.fac-chip').forEach(btn => {
    const on = activeFacs.has(btn.dataset.fac);
    btn.classList.toggle('bg-lantern', on);
    btn.classList.toggle('border-lantern', on);
    btn.classList.toggle('text-white', on);
    btn.classList.toggle('bg-white', !on);
    btn.setAttribute('aria-pressed', on);
  });
}

/* カテゴリ・設備・検索・お気に入りフィルターをすべて初期状態に戻す */
function resetFilters() {
  Object.keys(CATEGORIES).forEach(k => activeCats.add(k));
  activeFacs.clear();
  searchQuery = '';
  showFavoritesOnly = false;
  showVisitedOnly = false;
  const si1 = document.getElementById('search-input');
  const si2 = document.getElementById('search-input-sp');
  if (si1) si1.value = '';
  if (si2) si2.value = '';
  syncChipStyles();
  syncFavFilterButton();
  syncVisitFilterButton();
  render();
}

/* =====================================================================
 * フィルタリング・描画
 * ===================================================================== */
function filteredSpots() {
  const q = searchQuery.trim().toLowerCase();
  return allSpots.filter(s => {
    if (!activeCats.has(s.category)) return false;
    for (const f of activeFacs) {
      if (!s.facilities || !s.facilities[f]) return false; // AND条件
    }
    if (showFavoritesOnly && !favoriteSpotIds.has(s.id)) return false;
    if (showVisitedOnly && !visitsForSpot(s.id).length) return false;
    if (q) {
      const hay = `${s.name || ''} ${s.description || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function popupAutoPanOptions() {
  // ヘッダー・検索バー・フィルターチップ・ボトムシートなど、地図の上に重なる
  // 自前UIの実際の高さを測って、それらに隠れない範囲にポップアップを収める
  const isMobileLayout = window.innerWidth < 768;
  const headerEl = document.querySelector('header');
  const headerH = headerEl ? headerEl.getBoundingClientRect().height : 0;

  let topReserved = headerH + 12;
  if (isMobileLayout) {
    const overlayEl = document.getElementById('mobile-search-overlay');
    if (overlayEl) topReserved += overlayEl.getBoundingClientRect().height + 8;
  }

  let bottomReserved = 12;
  if (isMobileLayout) {
    const sheetEl = document.getElementById('sheet');
    if (sheetEl) bottomReserved += Math.max(0, window.innerHeight - sheetEl.getBoundingClientRect().top);
  }

  const availableH = Math.max(200, window.innerHeight - topReserved - bottomReserved);
  return {
    autoPanPaddingTopLeft: [16, Math.round(topReserved)],
    autoPanPaddingBottomRight: [16, Math.round(bottomReserved)],
    maxHeight: Math.round(availableH),
    maxWidth: Math.min(340, window.innerWidth - 32), // 画面端すれすれにならないよう左右に余白を確保
  };
}

function render() {
  // マーカー再構築（クラスタリング利用・ポップアップ内容は開いたときに生成して高速化）
  markerClusterGroup.clearLayers();
  markers = {};
  const spots = filteredSpots();
  const newMarkers = [];
  const popupOpts = { closeButton: true, ...popupAutoPanOptions() };

  spots.forEach(spot => {
    // 1件の描画失敗（不正データ等）で他のスポットまで巻き込まれないよう分離
    try {
      const m = L.marker([spot.lat, spot.lng], { icon: makeIcon(spot.category), title: spot.name })
        .bindPopup('', popupOpts); // 内容はpopupopen時に設定（初期描画を軽くする）
      m.spotId = spot.id;
      m.on('click', () => highlightCard(spot.id));
      markers[spot.id] = m;
      newMarkers.push(m);
    } catch (e) {
      console.error('スポットの描画に失敗しました:', spot.id, spot.name, e);
    }
  });
  markerClusterGroup.addLayers(newMarkers);

  // リスト再構築（PC・スマホ）：件数が多い場合は表示上限を設けて動作を軽く保つ
  const listSpots = spots.slice(0, LIST_RENDER_LIMIT);
  for (const id of ['spot-list-pc', 'spot-list-sp']) {
    const list = document.getElementById(id);
    list.innerHTML = '';
    if (spots.length === 0) {
      list.innerHTML = `<div class="text-center text-sm text-gray-400 py-10">条件に合うスポットがありません。<br>${searchQuery.trim() ? '検索キーワードやフィルターを変更してみてください。' : 'フィルターを変更してみてください。'}<br>
        <button type="button" class="auth-btn-link mt-2" onclick="resetFilters()">🔄 フィルターをリセット</button></div>`;
    } else {
      const frag = document.createDocumentFragment();
      listSpots.forEach(s => {
        try { frag.appendChild(spotCard(s)); }
        catch (e) { console.error('カードの描画に失敗しました:', s.id, s.name, e); }
      });
      list.appendChild(frag);
      if (spots.length > LIST_RENDER_LIMIT) {
        const note = document.createElement('p');
        note.className = 'text-center text-[11px] text-gray-400 py-3 px-2';
        note.textContent = `上位${LIST_RENDER_LIMIT}件のみ一覧表示しています（該当${spots.length}件・地図には全件表示）。検索やフィルターで絞り込むと見やすくなります。`;
        list.appendChild(note);
      }
    }
  }

  // 件数表示
  document.getElementById('spot-count').textContent = `${spots.length} / ${allSpots.length} 件`;
  document.getElementById('sheet-count').textContent = `(${spots.length})`;
}

async function handleShareSpot(id) {
  const spot = allSpots.find(s => s.id === id);

  if (navigator.share) {
    try { await navigator.share({ title, url }); return; } catch (e) { /* キャンセル等は無視 */ return; }
  }
  try {
    await navigator.clipboard.writeText(url);

    prompt('このリンクをコピーしてください:', url);

    history.replaceState(null, '', url.pathname + (url.search || '') + url.hash);

});

 * ===================================================================== */
let myLocationMarker = null;
document.getElementById('locate-btn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('お使いのブラウザは位置情報に対応していません。'); return; }
  const btn = document.getElementById('locate-btn');
  btn.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      if (myLocationMarker) map.removeLayer(myLocationMarker);
      myLocationMarker = L.layerGroup([
        L.circle([latitude, longitude], { radius: accuracy, color: '#3B82A0', weight: 1, fillOpacity: 0.1 }),
        L.circleMarker([latitude, longitude], { radius: 8, color: '#fff', weight: 3, fillColor: '#3B82A0', fillOpacity: 1 }),
      ]).addTo(map);
      map.flyTo([latitude, longitude], 13, { duration: 0.8 });
      btn.textContent = '📍';
    },
    err => {
      alert('現在地を取得できませんでした。位置情報の利用を許可してください。');
      btn.textContent = '📍';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

/* =====================================================================
 * スマホ：ボトムシート（ドラッグ＆タップで peek / half / full）
 * ===================================================================== */
const sheet = document.getElementById('sheet');
const grip = document.getElementById('sheet-grip');
const SHEET_H = () => sheet.getBoundingClientRect().height;
const SNAP = { peek: () => SHEET_H() - 96, half: () => SHEET_H() * 0.5, full: () => 0 };
let sheetState = 'peek';

function setSheet(state) {
  sheetState = state;
  sheet.style.transform = `translateY(${SNAP[state]()}px)`;
}

grip.addEventListener('click', () => setSheet(sheetState === 'peek' ? 'half' : 'peek'));

let dragStartY = null, dragStartOffset = 0;
grip.addEventListener('pointerdown', e => {
  dragStartY = e.clientY;
  dragStartOffset = SNAP[sheetState]();
  sheet.style.transition = 'none';
  grip.setPointerCapture(e.pointerId);
});
grip.addEventListener('pointermove', e => {
  if (dragStartY === null) return;
  const offset = Math.min(Math.max(dragStartOffset + (e.clientY - dragStartY), 0), SHEET_H() - 60);
  sheet.style.transform = `translateY(${offset}px)`;
});
grip.addEventListener('pointerup', e => {
  if (dragStartY === null) return;
  const moved = e.clientY - dragStartY;
  sheet.style.transition = '';
  // 移動方向でスナップ先を決定
  const order = ['full', 'half', 'peek'];
  let idx = order.indexOf(sheetState);
  if (moved > 50) idx = Math.min(idx + 1, 2);
  else if (moved < -50) idx = Math.max(idx - 1, 0);
  setSheet(order[idx]);
  dragStartY = null;
});

/* =====================================================================
 * ユーティリティ
 * ===================================================================== */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

window.addEventListener('resize', () => { if (window.innerWidth < 768) setSheet(sheetState); });

async function callApi(action, payload = {}) {
  const res = await fetch(CONFIG.gasUrl, {
    method: 'POST',
    // text/plain にすることでプリフライト(OPTIONS)を回避（GAS標準パターン）
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadMemberSpots() {
  const res = await fetch(CONFIG.gasUrl + '?action=listSpots', { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error + (json.message ? ': ' + json.message : ''));
  return normalizeSpotList(json.spots);
}

  localStorage.removeItem('kurumatabi_auth');
  auth.token = null; auth.userId = null; auth.nickname = null; auth.mustChangePassword = false;
}
async function restoreSession() {
  const raw = localStorage.getItem('kurumatabi_auth');
  if (!raw) return;
  try {
    const saved = JSON.parse(raw);
    auth.token = saved.token; auth.userId = saved.userId; auth.nickname = saved.nickname;
    const res = await callApi('me', { token: auth.token });
    if (!res.ok) { clearSession(); return; }
    auth.nickname = res.nickname; auth.userId = res.userId; auth.mustChangePassword = res.mustChangePassword;
    if (auth.mustChangePassword) openChangePasswordModal(true);
  } catch (e) {

}

function togglePw(btn) {
  const input = btn.previousElementSibling;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '隠す' : '表示';
}

function pwFieldHtml(id, labelText) {
  return `
    <div>
      <label class="auth-label" for="${id}">${labelText}</label>
      <div class="pw-field">
        <input id="${id}" type="password" class="auth-input pr-14" autocomplete="off" />
        <button type="button" class="pw-toggle" onclick="togglePw(this)">表示</button>
      </div>
    </div>`;
}

/* ---------- 会員登録 ---------- */
function openRegisterModal() {
  openModal(`
    <h2 class="font-maru font-bold text-lg mb-3">会員登録</h2>
    <div class="space-y-3">
      <div>
        <label class="auth-label" for="reg-email">メールアドレス</label>
        <input id="reg-email" type="email" class="auth-input" autocomplete="email" />
      </div>
      <div>
        <label class="auth-label" for="reg-nickname">ニックネーム（表示名）</label>
        <input id="reg-nickname" type="text" class="auth-input" maxlength="20" />
      </div>
      <div class="bg-mist rounded-lg p-3 max-h-32 overflow-y-auto text-[11px] text-gray-600 whitespace-pre-wrap leading-relaxed">${esc(TERMS_TEXT)}</div>
      <label class="flex items-center gap-2 text-xs font-medium">
        <input id="reg-agree" type="checkbox" class="w-4 h-4" />
        注意事項・免責事項に同意します
      </label>
      <p id="reg-error" class="auth-error"></p>
      <button type="button" id="reg-submit" class="auth-btn-primary" onclick="handleRegister()">仮パスワードを発行してメールで受け取る</button>

    </div>`);
}

async function handleRegister() {
  const email = document.getElementById('reg-email').value.trim();
  const nickname = document.getElementById('reg-nickname').value.trim();
  const agreed = document.getElementById('reg-agree').checked;
  const errEl = document.getElementById('reg-error');
  errEl.textContent = '';
  if (!email || !nickname) { errEl.textContent = 'メールアドレスとニックネームを入力してください。'; return; }
  if (!agreed) { errEl.textContent = '注意事項・免責事項への同意が必要です。'; return; }

  const btn = document.getElementById('reg-submit');
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const res = await callApi('register', { email, nickname, agreedTerms: true });
    if (!res.ok) {
      errEl.textContent = res.error === 'email_taken' ? 'このメールアドレスは既に登録されています。' : '登録に失敗しました。入力内容をご確認ください。';
      btn.disabled = false; btn.textContent = '仮パスワードを発行してメールで受け取る';
      return;
    }
    openModal(`
      <h2 class="font-maru font-bold text-lg mb-2">登録完了</h2>
      <p class="text-sm text-gray-600 leading-relaxed">仮パスワードをメールで送信しました。メールをご確認のうえ、ログインしてください。</p>
      <button type="button" class="auth-btn-primary mt-4" onclick="openLoginModal()">ログイン画面へ</button>`);
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    btn.disabled = false; btn.textContent = '仮パスワードを発行してメールで受け取る';
  }
}

/* ---------- ログイン ---------- */
function openLoginModal() {
  openModal(`
    <h2 class="font-maru font-bold text-lg mb-3">ログイン</h2>
    <div class="space-y-3">
      <div>
        <label class="auth-label" for="login-email">メールアドレス</label>
        <input id="login-email" type="email" class="auth-input" autocomplete="email" />
      </div>
      ${pwFieldHtml('login-password', 'パスワード（仮パスワード可）')}
      <p id="login-error" class="auth-error"></p>
      <button type="button" id="login-submit" class="auth-btn-primary" onclick="handleLogin()">ログイン</button>
      <div class="flex justify-between text-xs pt-1">
        <button type="button" class="auth-btn-link" onclick="openForgotPasswordModal()">パスワードを忘れた方</button>
        <button type="button" class="auth-btn-link" onclick="openRegisterModal()">新規会員登録</button>
      </div>
    </div>`);
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'メールアドレスとパスワードを入力してください。'; return; }

  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = 'ログイン中…';
  try {
    const res = await callApi('login', { email, password });
    if (!res.ok) {
      errEl.textContent = 'メールアドレスまたはパスワードが正しくありません。';
      btn.disabled = false; btn.textContent = 'ログイン';
      return;
    }
    auth.token = res.token; auth.userId = res.userId; auth.nickname = res.nickname; auth.mustChangePassword = res.mustChangePassword;
    saveSession();
    renderAuthArea();
    if (auth.mustChangePassword) {
      openChangePasswordModal(true);
    } else {
      closeModal();
    }
    // 地図の再描画（スポット件数が多いと重い）は、モーダルを閉じる操作が先に画面に反映されてから行う
    setTimeout(() => {
      render();
      loadMemberSpots().then(spots => { allSpots = allSpots.filter(s => s.source !== 'member').concat(spots); render(); }).catch(e => { console.warn('ログイン後の一覧再取得に失敗しました:', e.message); showDataLoadWarning(); });
      loadFavorites().then(() => { syncFavFilterButton(); render(); }).catch(() => {});
      loadVisits().then(() => { syncVisitFilterButton(); render(); }).catch(() => {});
    }, 0);
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    btn.disabled = false; btn.textContent = 'ログイン';
  }
}

/* ---------- 初回ログイン時 / マイページからのパスワード変更 ---------- */
function openChangePasswordModal(forced = false) {
  openModal(`
    <h2 class="font-maru font-bold text-lg mb-2">パスワード変更</h2>
    ${forced ? `<p class="text-xs text-gray-500 mb-3">初回ログインです。新しいパスワードを設定してください。</p>` : ''}
    <div class="space-y-3">
      ${pwFieldHtml('newpw-1', '新しいパスワード（8文字以上）')}
      ${pwFieldHtml('newpw-2', '新しいパスワード（確認）')}
      <p id="newpw-error" class="auth-error"></p>
      <button type="button" id="newpw-submit" class="auth-btn-primary" onclick="handleChangePassword(${forced})">変更する</button>
      ${!forced ? `<p class="text-center text-xs"><button type="button" class="auth-btn-link" onclick="openMyPageModal()">戻る</button></p>` : ''}
    </div>`);
}

async function handleChangePassword(forced) {
  const p1 = document.getElementById('newpw-1').value;
  const p2 = document.getElementById('newpw-2').value;
  const errEl = document.getElementById('newpw-error');
  errEl.textContent = '';
  if (p1.length < 8) { errEl.textContent = '8文字以上で入力してください。'; return; }
  if (p1 !== p2) { errEl.textContent = '確認用パスワードが一致しません。'; return; }

  const btn = document.getElementById('newpw-submit');
  btn.disabled = true; btn.textContent = '変更中…';
  try {
    const res = await callApi('changePassword', { token: auth.token, newPassword: p1 });
    if (!res.ok) { errEl.textContent = '変更に失敗しました。'; btn.disabled = false; btn.textContent = '変更する'; return; }
    auth.mustChangePassword = false;
    if (forced) { closeModal(); } else { openMyPageModal('パスワードを変更しました。'); }
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    btn.disabled = false; btn.textContent = '変更する';
  }
}

/* =====================================================================
 * 会員機能：スポット投稿・編集・削除
 * ===================================================================== */
function spotFormFields(spot = {}) {
  const catOptions = Object.entries(CATEGORIES).map(([k, c]) =>
    `<option value="${k}" ${spot.category === k ? 'selected' : ''}>${c.icon} ${c.label}</option>`).join('');
  const sleepOptions = Object.entries(SLEEP_STATUS).map(([k, s]) =>
    `<option value="${k}" ${sleepStatusOf(spot) === k ? 'selected' : ''}>${s.icon} ${s.label}</option>`).join('');
  const facChecks = Object.entries(FACILITIES).map(([k, f]) => `
    <label class="flex items-center gap-1 text-xs bg-mist rounded-lg px-2 py-1.5">
      <input type="checkbox" data-fac="${k}" class="spot-fac-check" ${spot.facilities && spot.facilities[k] ? 'checked' : ''} /> ${f.icon} ${f.label}
    </label>`).join('');
  return `
    <div class="space-y-3">
      <div>
        <label class="auth-label" for="spot-name">名称</label>
        <input id="spot-name" type="text" class="auth-input" maxlength="60" value="${esc(spot.name || '')}" />
      </div>
      <div>
        <label class="auth-label" for="spot-category">カテゴリ</label>
        <select id="spot-category" class="auth-input">${catOptions}</select>
      </div>
      <div>
        <label class="auth-label" for="spot-sleep">車中泊の可否</label>
        <select id="spot-sleep" class="auth-input">${sleepOptions}</select>
        <p class="text-[11px] text-gray-400 mt-1">実際に確認できた内容にしてください。不明な場合は「要確認」を選んでください。</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="auth-label" for="spot-lat">緯度</label>
          <input id="spot-lat" type="number" step="0.000001" class="auth-input" value="${spot.lat ?? ''}" />
        </div>
        <div>
          <label class="auth-label" for="spot-lng">経度</label>
          <input id="spot-lng" type="number" step="0.000001" class="auth-input" value="${spot.lng ?? ''}" />
        </div>
      </div>
      <p class="text-[11px] text-gray-400 -mt-1.5">📍現在地から緯度経度を入力: <button type="button" class="auth-btn-link" onclick="fillCurrentLocation()">現在地を使う</button>　／　<button type="button" class="auth-btn-link" onclick="startMapPickLocation()">🗺️ 地図をタップして選択</button></p>
      <div>
        <div class="flex items-center justify-between">
          <label class="auth-label !mb-0" for="spot-desc">説明</label>
          <button type="button" id="voice-input-btn" class="auth-btn-link" onclick="toggleVoiceRecording()">🎙️ 音声で入力</button>
        </div>
        <textarea id="spot-desc" rows="3" class="auth-input mt-1" maxlength="300">${esc(spot.description || '')}</textarea>
        <p id="voice-status" class="text-[11px] text-gray-400 mt-1"></p>
        <div id="voice-preview-wrap" hidden class="mt-1.5 p-2 rounded-lg bg-mist space-y-1.5">
          <p class="text-[11px] font-bold text-pine/70">🎙️ 音声認識結果（内容を確認・加筆・修正してから反映してください）</p>
          <textarea id="voice-preview-text" rows="3" class="auth-input !text-xs"></textarea>
          <div class="flex gap-3 flex-wrap">
            <button type="button" class="auth-btn-link" onclick="applyVoiceText('append')">説明欄に追加する</button>
            <button type="button" class="auth-btn-link" onclick="applyVoiceText('replace')">説明欄を置き換える</button>
            <button type="button" class="auth-btn-link" style="color:#C4604F" onclick="discardVoiceText()">この内容を破棄</button>
          </div>
        </div>
      </div>
      <div>
        <p class="auth-label">設備</p>
        <div class="grid grid-cols-2 gap-1.5">${facChecks}</div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="auth-label" for="spot-hours">営業時間</label>
          <input id="spot-hours" type="text" class="auth-input" maxlength="60" value="${esc(spot.openHours || '')}" />
        </div>
        <div>
          <label class="auth-label" for="spot-fee">料金</label>
          <input id="spot-fee" type="text" class="auth-input" maxlength="40" value="${esc(spot.fee || '')}" />
        </div>
      </div>
      <div>
        <label class="auth-label" for="spot-tel">電話番号</label>
        <input id="spot-tel" type="tel" class="auth-input" maxlength="20" placeholder="0X0-XXXX-XXXX" value="${esc(spot.tel || '')}" />
      </div>

    </div>`;
}

/* ⑥ 写真フィールド（既存の投稿済み写真＋これから追加する写真） */
function photoFieldsHtml(spot) {
  const existing = (spot.photos || []).map(id => `
    <div class="relative">
      <img src="${drivePhotoUrl(id, 200)}" alt="" class="w-16 h-16 object-cover rounded-lg border border-pine/10" />
      <button type="button" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-white border border-pine/20 text-[10px] leading-none" onclick="handleDeleteExistingPhoto('${spot.id}','${id}')" aria-label="この写真を削除">✕</button>
    </div>`).join('');
  return `
    <div>
      <p class="auth-label">写真（最大${MAX_PHOTOS_PER_SPOT}枚・自動でサイズを調整してアップロードします）</p>
      <div id="existing-photos" class="flex flex-wrap gap-2 mb-2">${existing}</div>
      <div id="pending-photos" class="flex flex-wrap gap-2 mb-2"></div>
      <input type="file" id="spot-photo-input" accept="image/*" multiple class="text-xs w-full" onchange="handlePhotoFilesSelected(event)" />
    </div>`;
}

function fillCurrentLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('spot-lat').value = pos.coords.latitude.toFixed(6);
    document.getElementById('spot-lng').value = pos.coords.longitude.toFixed(6);
  });
}

/* =====================================================================
 * 地図をタップして緯度・経度を選択（投稿/編集フォーム用）
 * ===================================================================== */
let mapPickHandler = null;
let mapPickMarker = null;

function startMapPickLocation() {
  document.getElementById('modal-overlay').hidden = true;   // フォームを一時的に隠して地図を全面表示
  document.getElementById('map-pick-banner').hidden = false;
  document.getElementById('map').style.cursor = 'crosshair';

  mapPickHandler = (e) => {
    const { lat, lng } = e.latlng;
    const latEl = document.getElementById('spot-lat');
    const lngEl = document.getElementById('spot-lng');
    if (latEl) latEl.value = lat.toFixed(6);
    if (lngEl) lngEl.value = lng.toFixed(6);

    if (mapPickMarker) map.removeLayer(mapPickMarker);
    mapPickMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: '', html: '<div class="pin" style="background:#E8A33D"><span>📍</span></div>', iconSize: [34, 34], iconAnchor: [17, 34] }),
    }).addTo(map);

    endMapPickLocation();
  };
  map.on('click', mapPickHandler);
}

function endMapPickLocation() {
  if (mapPickHandler) { map.off('click', mapPickHandler); mapPickHandler = null; }
  document.getElementById('map-pick-banner').hidden = true;
  document.getElementById('map').style.cursor = '';
  document.getElementById('modal-overlay').hidden = false; // フォームを再表示
}

function cancelMapPickLocation() {
  if (!mapPickHandler) return; // 選択中でなければ何もしない
  endMapPickLocation();
}

function readSpotForm() {
  const facilities = {};
  document.querySelectorAll('.spot-fac-check').forEach(cb => { if (cb.checked) facilities[cb.dataset.fac] = true; });
  return {
    name: document.getElementById('spot-name').value.trim(),
    category: document.getElementById('spot-category').value,
    sleepStatus: document.getElementById('spot-sleep').value,
    lat: parseFloat(document.getElementById('spot-lat').value),
    lng: parseFloat(document.getElementById('spot-lng').value),
    description: document.getElementById('spot-desc').value.trim(),
    facilities,
    openHours: document.getElementById('spot-hours').value.trim(),
    fee: document.getElementById('spot-fee').value.trim(),
    tel: document.getElementById('spot-tel').value.trim(),
  };
}

document.getElementById('post-spot-btn').addEventListener('click', () => {
  pendingPhotoFiles = [];
  currentEditingSpotPhotosCount = 0;
  openModal(`
    <h2 class="font-maru font-bold text-lg mb-3">スポットを投稿</h2>
    ${spotFormFields()}
    <button type="button" id="spot-submit-btn" class="auth-btn-primary mt-1" onclick="handleSubmitSpot()">投稿する</button>`);
});

async function handleSubmitSpot() {
  const d = readSpotForm();
  const errEl = document.getElementById('spot-form-error');
  errEl.textContent = '';
  if (!d.name || isNaN(d.lat) || isNaN(d.lng)) { errEl.textContent = '名称・緯度・経度は必須です。'; return; }

  const btn = document.getElementById('spot-submit-btn');
  btn.disabled = true; btn.textContent = '投稿中…';
  try {
    const res = await callApi('submitSpot', { token: auth.token, spot: d });
    if (!res.ok) { errEl.textContent = '投稿に失敗しました。'; btn.disabled = false; btn.textContent = '投稿する'; return; }
    if (pendingPhotoFiles.length) {
      btn.textContent = '写真をアップロード中…';
      await uploadPendingPhotos(res.id);
    }
    closeModal();
    try {
      const spots = await loadMemberSpots();
      allSpots = allSpots.filter(s => s.source !== 'member').concat(spots);
      render();
    } catch (e2) {
      console.warn('投稿後の一覧再取得に失敗しました:', e2.message);
      showDataLoadWarning();
    }
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    btn.disabled = false; btn.textContent = '投稿する';
  }
}

function openEditSpotModal(spotId) {
  const spot = allSpots.find(s => s.id === spotId);
  if (!spot) return;
  pendingPhotoFiles = [];
  currentEditingSpotPhotosCount = (spot.photos || []).length;
  openModal(`
    <h2 class="font-maru font-bold text-lg mb-3">スポットを編集</h2>
    ${spotFormFields(spot)}
    <button type="button" id="spot-submit-btn" class="auth-btn-primary mt-1" onclick="handleUpdateSpot('${spotId}')">更新する</button>`);
}

async function handleUpdateSpot(spotId) {
  const d = readSpotForm();
  const errEl = document.getElementById('spot-form-error');
  errEl.textContent = '';
  if (!d.name || isNaN(d.lat) || isNaN(d.lng)) { errEl.textContent = '名称・緯度・経度は必須です。'; return; }

  const btn = document.getElementById('spot-submit-btn');
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const res = await callApi('updateSpot', { token: auth.token, spotId, spot: d });
    if (!res.ok) { errEl.textContent = '更新に失敗しました。'; btn.disabled = false; btn.textContent = '更新する'; return; }
    if (pendingPhotoFiles.length) {
      btn.textContent = '写真をアップロード中…';
      await uploadPendingPhotos(spotId);
    }
    closeModal();
    try {
      const spots = await loadMemberSpots();
      allSpots = allSpots.filter(s => s.source !== 'member').concat(spots);
      render();
    } catch (e2) {
      console.warn('更新後の一覧再取得に失敗しました:', e2.message);
      showDataLoadWarning();
    }
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    btn.disabled = false; btn.textContent = '更新する';
  }
}

async function handleDeleteSpot(spotId) {
  if (!confirm('この投稿を削除しますか？関連するコメント・写真も削除されます。')) return;
  try {
    const res = await callApi('deleteSpot', { token: auth.token, spotId });
    if (!res.ok) { alert('削除に失敗しました。'); return; }
    map.closePopup();
    try {
      const spots = await loadMemberSpots();
      allSpots = allSpots.filter(s => s.source !== 'member').concat(spots);
      render();
    } catch (e2) {
      console.warn('削除後の一覧再取得に失敗しました:', e2.message);
      showDataLoadWarning();
    }
  } catch (e) {
    alert('通信エラーが発生しました。時間をおいて再度お試しください。');
  }
}

/* =====================================================================
 * ⑥ 写真アップロード（Googleドライブ・クライアント側で自動リサイズ）
 * ===================================================================== */
function resizeImageToBase64(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]); // base64のみ（プレフィックス除去）
      };
      img.onerror = () => reject(new Error('image_decode_failed'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file_read_failed'));
    reader.readAsDataURL(file);
  });
}

function handlePhotoFilesSelected(e) {
  const room = MAX_PHOTOS_PER_SPOT - currentEditingSpotPhotosCount - pendingPhotoFiles.length;
  const files = Array.from(e.target.files).slice(0, Math.max(room, 0));
  if (files.length < e.target.files.length) alert(`写真は最大${MAX_PHOTOS_PER_SPOT}枚までです。`);
  pendingPhotoFiles.push(...files);
  e.target.value = '';
  renderPendingPhotos();
}

function renderPendingPhotos() {
  const box = document.getElementById('pending-photos');
  if (!box) return;
  box.innerHTML = '';
  pendingPhotoFiles.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'relative';
    div.innerHTML = `
      <img src="${url}" alt="" class="w-16 h-16 object-cover rounded-lg border-2 border-lantern/60" />
      <button type="button" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-white border border-pine/20 text-[10px] leading-none" aria-label="この写真を選択解除">✕</button>`;
    div.querySelector('button').addEventListener('click', () => { pendingPhotoFiles.splice(idx, 1); renderPendingPhotos(); });
    box.appendChild(div);
  });
}

async function uploadPendingPhotos(spotId) {
  for (const file of pendingPhotoFiles) {
    try {
      const base64 = await resizeImageToBase64(file);
      await callApi('uploadPhoto', { token: auth.token, spotId, filename: file.name, mimeType: 'image/jpeg', dataBase64: base64 });
    } catch (e) {
      console.warn('写真アップロードに失敗しました:', e);
    }
  }
  pendingPhotoFiles = [];
}

async function handleDeleteExistingPhoto(spotId, fileId) {
  if (!confirm('この写真を削除しますか？')) return;
  try {
    const res = await callApi('deletePhoto', { token: auth.token, spotId, fileId });
    if (!res.ok) { alert('削除に失敗しました。'); return; }
    const spot = allSpots.find(s => s.id === spotId);
    if (spot) spot.photos = res.photos;
    currentEditingSpotPhotosCount = res.photos.length;
    openEditSpotModal(spotId); // フォームを最新の写真一覧で再描画
    updateSpotCardInPlace(spotId);
    refreshOpenPopupContent(spotId);
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

/* =====================================================================
 * 音声入力（Gemini APIで文字起こし・整形 → 加筆・修正・削除可能なプレビュー）
 * ===================================================================== */
let voiceMediaRecorder = null;
let voiceAudioChunks = [];
let voiceMaxTimer = null;

async function toggleVoiceRecording() {
  const btn = document.getElementById('voice-input-btn');
  const statusEl = document.getElementById('voice-status');
  if (voiceMediaRecorder && voiceMediaRecorder.state === 'recording') {
    voiceMediaRecorder.stop();
    return;
  }
  if (!auth.token) { statusEl.textContent = 'ログインすると音声入力を利用できます。'; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    alert('お使いのブラウザは音声入力に対応していません。');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceAudioChunks = [];
    voiceMediaRecorder = new MediaRecorder(stream);
    voiceMediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) voiceAudioChunks.push(ev.data); };
    voiceMediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearTimeout(voiceMaxTimer);
      btn.textContent = '🎙️ 音声で入力';
      handleVoiceRecorded();
    };
    voiceMediaRecorder.start();
    btn.textContent = '⏹️ 録音を停止';
    statusEl.textContent = '録音中…話し終わったら「⏹️録音を停止」を押してください（最長90秒）';
    voiceMaxTimer = setTimeout(() => {
      if (voiceMediaRecorder && voiceMediaRecorder.state === 'recording') voiceMediaRecorder.stop();
    }, 90000);
  } catch (e) {
    alert('マイクを使用できませんでした。ブラウザの権限設定をご確認ください。');
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function handleVoiceRecorded() {
  const statusEl = document.getElementById('voice-status');
  if (!statusEl) return; // フォームが閉じられていた場合
  statusEl.textContent = 'Geminiで文字起こし・整形中…';
  try {
    const mimeType = (voiceMediaRecorder && voiceMediaRecorder.mimeType) || 'audio/webm';
    const blob = new Blob(voiceAudioChunks, { type: mimeType });
    const base64 = await blobToBase64(blob);
    const res = await callApi('transcribeVoice', { token: auth.token, mimeType, audioBase64: base64 });
    if (!res.ok) { statusEl.textContent = '音声の認識に失敗しました。もう一度お試しください。'; return; }
    const previewWrap = document.getElementById('voice-preview-wrap');
    const previewText = document.getElementById('voice-preview-text');
    if (previewWrap && previewText) {
      previewText.value = res.text;
      previewWrap.hidden = false;
    }
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '通信エラーが発生しました。';
  }
}

function applyVoiceText(mode) {
  const previewText = document.getElementById('voice-preview-text');
  const desc = document.getElementById('spot-desc');
  if (!previewText || !desc) return;
  const text = previewText.value.trim();
  if (!text) return;
  desc.value = (mode === 'append' && desc.value.trim()) ? (desc.value.trim() + '\n' + text) : text;
  discardVoiceText();
}

function discardVoiceText() {
  const wrap = document.getElementById('voice-preview-wrap');
  const previewText = document.getElementById('voice-preview-text');
  if (wrap) wrap.hidden = true;
  if (previewText) previewText.value = '';
}

/* =====================================================================
 * 会員機能：コメント
 * ===================================================================== */
async function loadCommentsIntoPopup(spotId) {
  const box = document.getElementById('comments-' + spotId);
  if (!box) return;
  try {
    const res = await fetch(CONFIG.gasUrl + '?action=listComments&spotId=' + encodeURIComponent(spotId), { cache: 'no-cache' });
    const json = await res.json();
    const box2 = document.getElementById('comments-' + spotId); // ポップアップ再描画対策
    if (!box2) return;
    if (!json.ok || json.comments.length === 0) {
      box2.innerHTML = `<p class="text-gray-400">まだコメントはありません。</p>`;
      return;
    }
    box2.innerHTML = json.comments.map(c => `
      <div class="comment-item">
        <div class="flex items-start justify-between gap-2">
          <div>
            <p class="font-bold text-pine inline">${esc(c.authorNickname || '会員')}</p>
            ${c.rating > 0 ? `<span class="text-[11px] text-lantern ml-1" aria-label="評価${c.rating}">${'★'.repeat(c.rating)}${'☆'.repeat(5 - c.rating)}</span>` : ''}
          </div>
          ${auth.userId && c.authorId === auth.userId ? `
          <span class="shrink-0 flex gap-2">
            <button type="button" class="auth-btn-link !text-[10px]" onclick="handleEditComment('${spotId}','${c.id}')">編集</button>
            <button type="button" class="auth-btn-link !text-[10px]" style="color:#C4604F" onclick="handleDeleteComment('${spotId}','${c.id}')">削除</button>
          </span>` : ''}
        </div>
        <p id="comment-text-${c.id}" class="text-gray-600 whitespace-pre-wrap leading-relaxed">${esc(c.text)}</p>
      </div>`).join('');
  } catch (e) {
    const box3 = document.getElementById('comments-' + spotId);
    if (box3) box3.innerHTML = `<p class="text-gray-400">コメントを読み込めませんでした。</p>`;
  }
}

/* ⑩ 評価（星）付きコメント */
function setCommentRating(spotId, val) {
  const box = document.getElementById('rating-input-' + spotId);
  if (!box) return;
  box.dataset.rating = val;
  box.querySelectorAll('.rating-star').forEach(btn => {
    const on = Number(btn.dataset.val) <= val;
    btn.classList.toggle('text-lantern', on);
    btn.classList.toggle('text-gray-300', !on);
  });
}

async function refreshStatsAndPopup(spotId) {
  await loadSpotStats();
  refreshOpenPopupContent(spotId);
  updateSpotCardInPlace(spotId);
}

async function handleAddComment(spotId) {
  const input = document.getElementById('comment-input-' + spotId);
  const text = input.value.trim();
  if (!text) return;
  const ratingBox = document.getElementById('rating-input-' + spotId);
  const rating = ratingBox ? Number(ratingBox.dataset.rating || 0) : 0;
  input.disabled = true;
  try {
    const res = await callApi('addComment', { token: auth.token, spotId, text, rating });
    if (res.ok) { input.value = ''; await refreshStatsAndPopup(spotId); }
    else alert('コメントの投稿に失敗しました。');
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
  input.disabled = false;
}

async function handleEditComment(spotId, commentId) {
  const el = document.getElementById('comment-text-' + commentId);
  const current = el.textContent;
  const next = prompt('コメントを編集', current);
  if (next === null || next.trim() === '') return;
  try {
    const res = await callApi('updateComment', { token: auth.token, commentId, text: next.trim() });
    if (res.ok) await refreshStatsAndPopup(spotId);
    else alert('編集に失敗しました。');
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

async function handleDeleteComment(spotId, commentId) {
  if (!confirm('このコメントを削除しますか？')) return;
  try {
    const res = await callApi('deleteComment', { token: auth.token, commentId });
    if (res.ok) await refreshStatsAndPopup(spotId);
    else alert('削除に失敗しました。');
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

renderAuthArea();
(async () => {
  await restoreSession(); // ⑦お気に入りの初期読込より先にログイン状態を復元しておく
  loadSpots().then(openSpotFromUrl);
})();
